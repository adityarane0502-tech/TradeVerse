<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
        TradeVerse
        {% endblock %}
    </title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #1f2937;
        }

        nav {
            background: #111827;
            padding: 15px 30px;
            display: flex;
            align-items: center;
            gap: 25px;
        }

        nav .brand {
            color: white;
            font-size: 22px;
            font-weight: bold;
            margin-right: auto;
        }

        nav a {
            color: #d1d5db;
            text-decoration: none;
            font-size: 15px;
        }

        nav a:hover {
            color: white;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            margin: 30px auto;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-bottom: 20px;
        }

        h2 {
            margin-bottom: 15px;
        }

        h3 {
            margin-bottom: 10px;
        }

        button {
            border: none;
            padding: 10px 18px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 14px;
        }

        button:hover {
            opacity: 0.9;
        }

        input {
            padding: 10px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            font-size: 14px;
        }

        .positive {
            color: #16a34a;
            font-weight: bold;
        }

        .negative {
            color: #dc2626;
            font-weight: bold;
        }

        .neutral {
            color: #6b7280;
            font-weight: bold;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #e5e7eb;
        }

        th {
            background: #f9fafb;
        }

        @media (max-width: 700px) {

            nav {
                flex-wrap: wrap;
                gap: 12px;
            }

            .container {
                width: 95%;
            }

            table {
                font-size: 13px;
            }

        }

    </style>

</head>

<body>

    <nav>

        <div class="brand">
            📈 TradeVerse
        </div>

        <a href="/dashboard">
            🏠 Dashboard
        </a>

        <a href="/portfolio">
            📁 Portfolio
        </a>

        <a href="/watchlist">
            ⭐ Watchlist
        </a>

        <a href="/transactions">
            📜 Transactions
        </a>

        <a href="/logout">
            🚪 Logout
        </a>

    </nav>

    <main class="container">

        {% block content %}
        {% endblock %}

    </main>

</body>

</html>
